<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F5F4A">
<title>소담상회</title>
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-180.png">
<style>
/* 소담상회 올인원 · 왼쪽 목록(채널·DM) + 가운데 대화 + 오른쪽 스레드. 휴대폰에서는 한 화면씩 넘겨 봐요 */
:root{
  --bg:#F4F4F6;--surface:#FFFFFF;--soft:#F1F3F1;--ink:#1A1F1C;--muted:#5C645F;--line:#E1E5E1;
  --side:#173F33;--side-ink:#E7F0EC;--side-muted:#9DBCB0;--side-hover:#21503F;--side-on:#2E6B56;
  --accent:#1F5F4A;--accent-soft:#E2EFE9;--accent-ink:#FFFFFF;--bad:#C2412A;--warn:#97600A;--men:#FFF4D6;
  --f:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111513;--surface:#1A1F1C;--soft:#222824;--ink:#E7EBE8;--muted:#9AA39D;--line:#2E3531;
  --side:#0E1A15;--side-ink:#DCE7E2;--side-muted:#86A397;--side-hover:#172A22;--side-on:#21483A;
  --accent:#6CC3A0;--accent-soft:#1D3229;--accent-ink:#0E1A15;--bad:#FF8E78;--warn:#F0C066;--men:#3A3115;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f);-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:9px 15px;font-weight:700;font-size:14px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.btn.danger{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px;font-size:15px;min-width:0;width:100%}
.muted{color:var(--muted)}.small{font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:11px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px);text-align:center}
/* 로그인 */
.gate{min-height:100%;display:grid;place-items:center;padding:24px}
.gate .box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px 26px;max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.gate img{width:72px;height:72px;border-radius:18px}
.gate h1{margin:0;font-size:22px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px;font-weight:700}
.gbtn svg{width:18px;height:18px}
/* 레이아웃 */
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);height:100%;height:100dvh}
.shell.thr{grid-template-columns:260px minmax(0,1fr) minmax(300px,380px)}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;min-height:0;padding-top:env(safe-area-inset-top,0px)}
.ws{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px}
.ws img{width:30px;height:30px;border-radius:8px}
.ws b{font-size:16px;flex:1}
.ws button{background:none;border:0;color:var(--side-muted);font-size:13px;padding:4px}
.slist{flex:1;overflow-y:auto;padding:10px 8px 20px}
.sh{display:flex;align-items:center;justify-content:space-between;padding:12px 8px 4px;font-size:12.5px;font-weight:700;color:var(--side-muted);letter-spacing:.02em}
.sh button{background:none;border:0;color:var(--side-muted);font-size:18px;line-height:1;padding:0 4px;border-radius:5px}
.sh button:hover{background:var(--side-hover);color:var(--side-ink)}
.si{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;color:var(--side-muted);text-align:left;padding:6px 10px;border-radius:7px;font-size:15px;min-width:0}
.si:hover{background:var(--side-hover)}
.si.on{background:var(--side-on);color:#fff}
.si.un{color:#fff;font-weight:700}
.si .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si .hash{opacity:.7;width:16px;text-align:center;flex:none}
.si .dot{width:8px;height:8px;border-radius:50%;background:#fff;flex:none}
.si .cnt{background:var(--bad);color:#fff;border-radius:999px;font-size:11.5px;font-weight:700;padding:1px 7px;flex:none}
.me{padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;font-size:14px}
.me .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me button{background:none;border:0;color:var(--side-muted);font-size:13px}
.av{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex:none;overflow:hidden;background:#4A7A68}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:24px;height:24px;border-radius:6px;font-size:11px}
.main,.thread{display:flex;flex-direction:column;min-height:0;background:var(--surface);min-width:0}
.thread{border-left:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);min-height:56px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.top h2{margin:0;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top h2 small{font-weight:500;color:var(--muted);font-size:13px;margin-left:8px}
.top .back{border:0;background:none;font-size:22px;line-height:1;padding:2px 6px;display:none}
.msgs{flex:1;overflow-y:auto;padding:12px 0 8px;overscroll-behavior:contain}
.day{display:flex;align-items:center;gap:10px;margin:14px 16px 6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.day:before,.day:after{content:'';flex:1;height:1px;background:var(--line)}
.m{display:grid;grid-template-columns:36px minmax(0,1fr);gap:0 10px;padding:4px 16px;position:relative}
.m:hover{background:var(--soft)}
.m.cont{padding-top:1px}
.m.cont .av{visibility:hidden;height:0}
.m.men{background:var(--men)}
.m .hd{display:flex;align-items:baseline;gap:8px}
.m .hd b{font-size:15px}
.m .hd time{font-size:12px;color:var(--muted)}
.m .tx{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.m .tx a{color:var(--accent)}
.m .tx .at{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 3px;font-weight:600}
.m .tx.del{color:var(--muted);font-style:italic}
.m .ed{font-size:12px;color:var(--muted)}
.rx{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.rx button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:1px 8px;font-size:13px;display:inline-flex;gap:4px;align-items:center}
.rx button.mine{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.trl{display:inline-flex;align-items:center;gap:6px;margin-top:4px;border:0;background:none;padding:2px 0;color:var(--accent);font-weight:700;font-size:13px}
.trl small{color:var(--muted);font-weight:500}
.acts{position:absolute;right:14px;top:-14px;display:none;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:2px}
.m:hover .acts,.m.act .acts{display:flex}
.acts button{border:0;background:none;padding:5px 7px;border-radius:6px;font-size:15px;line-height:1}
.acts button:hover{background:var(--soft)}
.emo{position:absolute;right:14px;top:22px;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.12);padding:4px;display:flex;gap:2px}
.emo button{border:0;background:none;font-size:20px;padding:4px 6px;border-radius:6px}
.emo button:hover{background:var(--soft)}
.more{display:block;margin:6px auto;border:0;background:none;color:var(--accent);font-weight:700;font-size:13px}
.comp{padding:8px 14px calc(12px + env(safe-area-inset-bottom,0px));position:relative}
.cbox{border:1px solid var(--line);border-radius:12px;background:var(--surface);display:flex;align-items:flex-end;gap:6px;padding:6px 6px 6px 12px}
.cbox:focus-within{border-color:var(--accent)}
.cbox textarea{flex:1;border:0;resize:none;background:none;padding:6px 0;max-height:180px;min-height:24px;line-height:1.45;outline:none;font-size:15px}
.cbox .send{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;width:36px;height:36px;font-size:16px;flex:none}
.cbox .send[disabled]{opacity:.35}
.mpop{position:absolute;left:14px;bottom:calc(100% - 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.12);min-width:220px;max-height:240px;overflow-y:auto;padding:4px;z-index:10}
.mpop button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:6px 8px;border-radius:7px;text-align:left}
.mpop button.sel,.mpop button:hover{background:var(--accent-soft)}
.hint{font-size:11.5px;color:var(--muted);margin:4px 2px 0}
.empty{color:var(--muted);text-align:center;padding:40px 20px}
.troot{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:6px}
.tcnt{font-size:12.5px;color:var(--muted);margin:2px 16px 6px}
/* 관리 · 새 DM */
.page{flex:1;overflow-y:auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:16px;max-width:860px;width:100%;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:16px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.srow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.srow:first-of-type{border-top:0}
.srow .who{flex:1;min-width:160px}
.srow .who b{display:block}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}.pill.warn{background:var(--men);color:var(--warn)}
.plist button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 6px;border-radius:9px;text-align:left}
.plist button:hover{background:var(--soft)}
.plist button[disabled]{opacity:.5;cursor:default}
.side .si .av.sm{background:#3E6B5A}
/* 프로젝트 · 할 일 */
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.tabs button{border:0;background:none;padding:9px 10px 8px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;font-size:14px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.page.wide{max-width:none}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.col{background:var(--soft);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:72px}
.col h4{margin:0 2px;font-size:13px;color:var(--muted);display:flex;gap:6px}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left}
.tk:hover{border-color:var(--muted)}
.tk.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tk .tt{font-weight:600;overflow-wrap:anywhere}
.tk.done .tt{text-decoration:line-through;color:var(--muted)}
.tm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.tm .who{display:inline-flex;align-items:center;gap:4px}
.od{color:var(--bad);font-weight:700}
.tk .btn{align-self:flex-start}
.tkd{padding:6px 16px 14px;display:flex;flex-direction:column;gap:14px}
.lbl{font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 5px}
.cm{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;padding:6px 16px}
.cm .hd{display:flex;gap:8px;align-items:baseline}.cm .hd time{font-size:12px;color:var(--muted)}
.cm .x{border:0;background:none;color:var(--muted);font-size:12px;padding:0 4px;margin-left:auto}
.cm .tx{white-space:pre-wrap;overflow-wrap:anywhere}
.cm .tx .at{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 3px;font-weight:600}
.sh .tg{background:none;border:0;color:var(--side-muted);font-size:12px;padding:6px 10px;text-align:left;width:100%}
/* 휴대폰: 한 화면씩 */
@media (max-width:899px){
  .shell,.shell.thr{grid-template-columns:minmax(0,1fr)}
  .shell[data-pane="list"] .main,.shell[data-pane="list"] .thread{display:none}
  .shell[data-pane="conv"] .side,.shell[data-pane="conv"] .thread{display:none}
  .shell[data-pane="thread"] .side,.shell[data-pane="thread"] .main{display:none}
  .thread{border-left:0}
  .top .back{display:block}
  .acts{top:-10px}
  .board{grid-template-columns:minmax(0,1fr)}
  input,textarea,select{font-size:16px!important}
}
</style>

<script>
(function(){
'use strict';

var TEAMS=['MANAGER','MD','OPERATION','VMD','PT'];
var EMO=[['like','👍'],['heart','❤️'],['lol','😂'],['ok','✅'],['eyes','👀'],['pray','🙏']],EMOM={};EMO.forEach(function(e){EMOM[e[0]]=e[1]});

function dayLabel(t){var d=new Date(ms(t)),n=new Date(),k=dayKey(t);if(k===dayKey(n.getTime()))return '오늘';n.setDate(n.getDate()-1);if(k===dayKey(n.getTime()))return '어제';return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WD[d.getDay()]+')'+(d.getFullYear()!==new Date().getFullYear()?' · '+d.getFullYear():'')}

var S={u:null,email:'',me:null,staff:{},users:{},channels:[],dms:[],reads:{},view:null,msgs:[],lim:60,thread:null,replies:[],pane:'list',emo:null,edit:null,loaded:{},tasks:[],task:null,tcm:[],cf:null,tkf:'all'};

/* 안 읽은 개수: 마지막으로 읽은 뒤 남이 보낸 메시지를 세요 (100개까지) */
var UC={};
function ucount(k,c,ref){if(!unread(k,c))return 0;var la=ms(c.lastAt),r=S.reads[k],rm=r&&r.at?ms(r.at):0,u=UC[k];

  h+='<div><p class="lbl">'+(proj?'프로젝트 이름':'채널 이름')+'</p><input class="inp" id="cf-name" maxlength="30" placeholder="'+(proj?'예: 12월 크리스마스 팝업':'예: 발주')+'" value="'+esc(f.name)+'"'+dis+'></div>';
  h+='<div><p class="lbl">설명 (선택)</p><input class="inp" id="cf-topic" maxlength="120" placeholder="'+(proj?'목표나 한 줄 설명':'무슨 이야기를 하는 곳인지')+'" value="'+esc(f.topic)+'"'+dis+'></div>';
  if(proj)h+='<div><p class="lbl">기간</p><div class="row"><input class="inp" id="cf-start" type="date" value="'+esc(f.start)+'" style="flex:1 1 140px"'+dis+'><span class="muted">~</span><input class="inp" id="cf-end" type="date" value="'+esc(f.end)+'" style="flex:1 1 140px"'+dis+'></div></div>'+(f.id?'<div><p class="lbl">상태</p><div class="chips"><button class="chip" data-act="cfdone" data-v="0" aria-pressed="'+!f.done+'"'+dis+'>진행 중</button><button class="chip" data-act="cfdone" data-v="1" aria-pressed="'+f.done+'"'+dis+'>완료</button></div></div>':'');
  if(!proj&&!f.id&&ed)h+='<label class="row small"><input type="checkbox" data-act="cfpriv"'+(f.priv?' checked':'')+'> 비공개 · 초대한 사람만 보고 쓸 수 있어요</label>';
  else if(!proj&&f.id)h+='<p class="small muted" style="margin:0">'+(f.priv?'🔒 비공개 채널 · 멤버만 보고 쓸 수 있어요':'# 공개 채널 · 모든 직원이 볼 수 있어요')+'</p>';
  h+='</div>';
  if(f.priv||proj){var act=Object.keys(S.staff).filter(function(e){return S.staff[e].active!==false||f.mem.indexOf(e)>=0}).sort(function(a,b){return String(sname(a)).localeCompare(String(sname(b)),'ko')});
    h+='<div class="card"><h3>'+(proj?'참여 인원':'멤버')+' '+f.mem.length+'명</h3>';
    if(ed)h+='<div class="row"><span class="small muted">팀 한 번에</span><div class="chips">'+TEAMS.map(function(t){return '<button class="chip" data-act="cfteam" data-v="'+t+'">'+t+'</button>'}).join('')+'</div></div><div class="chips">'+act.map(function(e){return '<button class="chip" data-act="cfmem" data-v="'+esc(e)+'" aria-pressed="'+(f.mem.indexOf(e)>=0)+'">'+esc(sname(e))+'</button>'}).join('')+'</div><p class="small muted" style="margin:0">아직 앱에 로그인하지 않은 직원도 넣을 수 있어요. 로그인하면 바로 보여요.</p>';
    else h+='<div class="plist">'+f.mem.map(function(e){return '<button disabled style="opacity:1">'+pav(e)+'<span>'+esc(sname(e))+'</span></button>'}).join('')+'</div>';
    h+='</div>'}
  if(ed)h+='<div class="row"><span class="sp"></span>'+(f.id?(S.cdel===f.id?'<button class="btn danger" data-act="cdel" data-id="'+esc(f.id)+'">정말 지우기</button>':'<button class="btn ghost" data-act="cdel" data-id="'+esc(f.id)+'">지우기</button>'):'')+'<button class="btn ghost" data-act="csback">취소</button><button class="btn" data-act="cfsave">'+(f.id?'저장':'만들기')+'</button></div>';
  return h+'</div>'}
function csetSave(){keepCf();var f=S.cf,n=String(f.name||'').trim().replace(/^#/,'');if(!n)return toast('이름을 적어 주세요.');
  if(S.channels.some(function(c){return c.name===n&&c.id!==f.id}))return toast('같은 이름이 이미 있어요.');
  if(f.kind==='proj'&&f.start&&f.end&&f.end<f.start)return toast('끝나는 날이 시작하는 날보다 빨라요.');
  var d={name:n.slice(0,30),topic:String(f.topic||'').trim().slice(0,120)};
  if(f.priv||f.kind){d.mem=f.mem.slice();if(!d.mem.length)return toast('멤버를 한 명 이상 넣어 주세요.')}
  if(f.kind==='proj'){d.start=f.start||'';d.end=f.end||'';d.done=!!f.done}
  if(!f.id){d.priv=!!(f.priv||f.kind);if(f.kind)d.kind=f.kind;if(d.priv&&d.mem.indexOf(S.email)<0)d.mem.push(S.email);d.ord=S.channels.length;d.by=S.u.uid;d.at=FV.serverTimestamp();
    var ref=db.collection('channels').doc();ref.set(d).then(function(){toast((f.kind?'프로젝트를':'채널을')+' 만들었어요');S.cf=null;openConv({k:'c',id:ref.id,tab:f.kind?'task':undefined,made:true})},function(x){toast('만들지 못했어요 · '+errMsg(x))});return}
  db.collection('channels').doc(f.id).update(d).then(function(){toast('저장했어요');S.cf=null;if(d.mem&&d.mem.indexOf(S.email)<0){S.view={k:'admin'};render()}else openConv({k:'c',id:f.id})},function(x){toast('저장하지 못했어요 · '+errMsg(x))})}
function csBack(){var f=S.cf;S.cf=null;S.cdel=null;var c=f&&f.id&&chan(f.id);if(c&&vis(c))return openConv({k:'c',id:c.id});if(isAdmin()&&f&&f.id){S.view={k:'admin'};return render()}var f0=S.channels.filter(vis)[0];if(f0&&!narrow())return openConv({k:'c',id:f0.id});S.view=null;S.pane='list';render()}
function keepSf(){var f=S.sf||(S.sf={teams:[]});['name','email'].forEach(function(k){var x=document.getElementById('sf-'+k);if(x)f[k]=x.value});var ad=document.getElementById('sf-admin');if(ad)f.admin=ad.checked}

/* ================= @멘션 고르기 ================= */
var MP={id:null,q:'',sel:0,list:[]};
function mpUpdate(t){var pre=t.value.slice(0,t.selectionStart),m=pre.match(/@([^\s@]{0,20})$/),pop=document.getElementById(t.id+'-pop');if(!pop)return;
  if(!m){pop.hidden=true;MP.id=null;return}var q=m[1];MP.id=t.id;MP.q=q;var cc=S.view.k==='c'&&chan(S.view.id);MP.list=Object.keys(S.users).filter(function(u){return u!==S.u.uid&&nameOf(u).indexOf(q)>=0&&(!cc||!cc.priv||(cc.mem||[]).indexOf(S.users[u].email)>=0)}).sort(function(a,b){return nameOf(a).localeCompare(nameOf(b),'ko')}).slice(0,8);if('전체'.indexOf(q)===0&&S.view.k==='c')MP.list.push('*');
  if(!MP.list.length){pop.hidden=true;MP.id=null;return}MP.sel=Math.min(MP.sel,MP.list.length-1);
  pop.innerHTML=MP.list.map(function(u,i){return '<button type="button" data-act="mpick" data-v="'+esc(u)+'" class="'+(i===MP.sel?'sel':'')+'">'+(u==='*'?'<span class="av sm" style="background:var(--accent)">@</span><b>전체</b><span class="small muted">채널 모두에게</span>':av(u,1)+'<b>'+esc(nameOf(u))+'</b>')+'</button>'}).join('');pop.hidden=false}
function mpPick(u){var t=document.getElementById(MP.id);if(!t)return;var pos=t.selectionStart,pre=t.value.slice(0,pos).replace(/@([^\s@]{0,20})$/,'@'+(u==='*'?'전체':nameOf(u))+' ');t.value=pre+t.value.slice(pos);t.setSelectionRange(pre.length,pre.length);t.focus();var pop=document.getElementById(MP.id+'-pop');if(pop)pop.hidden=true;MP.id=null;grow(t)}

/* ================= 입력 · 클릭 ================= */
function isComp(id){return id==='ta'||id==='tta'||id==='tkc'}
document.addEventListener('input',function(ev){var t=ev.target;if(isComp(t.id)){grow(t);mpUpdate(t)}});
document.addEventListener('change',function(ev){var t=ev.target,id=S.task;if(!id||!tk(id))return;var x=tk(id);
  if(t.id==='td-title'){var v=t.value.trim();if(v&&v!==x.title)tkUp(id,{title:v.slice(0,200)});else t.value=x.title}
  if(t.id==='td-memo'&&t.value!==(x.memo||''))tkUp(id,{memo:t.value.slice(0,2000)});
  if(t.id==='td-due'&&t.value!==(x.due||''))tkUp(id,{due:t.value})});
document.addEventListener('keydown',function(ev){var t=ev.target;
  if(isComp(t.id)&&MP.id===t.id){if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ev.preventDefault();MP.sel=(MP.sel+(ev.key==='ArrowDown'?1:-1)+MP.list.length)%MP.list.length;mpUpdate(t);return}if(ev.key==='Enter'||ev.key==='Tab'){ev.preventDefault();mpPick(MP.list[MP.sel]);return}if(ev.key==='Escape'){var p=document.getElementById(t.id+'-pop');if(p)p.hidden=true;MP.id=null;return}}
  if(isComp(t.id)&&ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing&&!narrow()){ev.preventDefault();var v=t.value;if(!v.trim())return;t.value='';grow(t);S.cmScroll=t.id==='tkc';send(v,t.id);return}
  if(t.id==='tk-title'&&ev.key==='Enter'&&!ev.isComposing){ev.preventDefault();tkAdd();return}
  if(t.id==='td-title'&&ev.key==='Enter'&&!ev.isComposing){ev.preventDefault();t.blur();return}
  if(t.classList&&t.classList.contains('tk')&&(ev.key==='Enter'||ev.key===' ')&&t===ev.target){ev.preventDefault();openTask(t.getAttribute('data-id'));return}
  if(t.id==='eta'){if(ev.key==='Escape'){S.edit=null;S.thread?renderThread():0;renderMsgs();return}if(ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing){ev.preventDefault();var m=t.closest('.m');saveEdit(m.getAttribute('data-id'),m.getAttribute('data-rid'),t.value)}}
  if(ev.key==='Escape'&&S.emo){S.emo=null;renderMsgs();renderThread()}});
document.addEventListener('click',function(ev){var b=ev.target.closest('[data-act]');
  if(S.emo&&(!b||['react','emo'].indexOf(b.getAttribute('data-act'))<0)){S.emo=null;renderMsgs();renderThread()}
  if(!b&&narrow()){var mm=ev.target.closest('.m');if(mm&&!ev.target.closest('a')){var k=mm.getAttribute('data-rid')||mm.getAttribute('data-id');S.act=S.act===k?null:k;renderMsgs();renderThread();return}}
  if(!b||b.disabled)return;var a=b.getAttribute('data-act'),id=b.getAttribute('data-id'),rid=b.getAttribute('data-rid'),v=b.getAttribute('data-v');
  if(a==='login')return login();
  if(a==='logout'){off();return auth.signOut()}
  if(a==='open')return openConv({k:b.getAttribute('data-k'),id:id});
  if(a==='back'){S.pane='list';if(narrow())S.view=S.view&&S.view.k!=='c'&&S.view.k!=='d'?null:S.view;render();return}
  if(a==='newdm'){stopConv();S.view={k:'newdm'};S.pane='conv';render();return}
  if(a==='dmto')return openDM(v);
  if(a==='admin'){stopConv();S.view={k:'admin'};S.pane='conv';render();if(v==='ch')setTimeout(function(){var c=document.getElementById('chadm');if(c)c.scrollIntoView()},30);return}
  if(a==='send'){var t=document.getElementById(v);if(!t||!t.value.trim())return;var val=t.value;t.value='';grow(t);S.cmScroll=v==='tkc';send(val,v);t.focus();return}
  if(a==='cset'){if(id)return openCset(id);if(isAdmin())return openCset('',v);return}
  if(a==='csback')return csBack();
  if(a==='showdone'){S.showDone=!S.showDone;render();return}
  if(a==='tab'){if(!S.view||!S.view.tab)return;closeThread(true);S.view.tab=v;S.pane='conv';S.atBottom=true;markRead();render();return}
  if(a==='tkf'){S.tkf=v;render();return}
  if(a==='tkadd')return tkAdd();
  if(a==='tkopen')return S.task===id&&!narrow()?closeThread():openTask(id);
  if(a==='tknext'){var tt=tk(id);if(tt)tkSt(id,(tt.st||'todo')==='todo'?'doing':'done');return}
  if(a==='tkst')return tkSt(id,v);
  if(a==='tkwho'){var tw=tk(id);if(!tw)return;var has=(tw.who||[]).indexOf(v)>=0,up={};up.who=has?FV.arrayRemove(v):FV.arrayUnion(v);tkUp(id,up);return}
  if(a==='tkdel'){if(S.tkdel!==id){S.tkdel=id;render();setTimeout(function(){if(S.tkdel===id){S.tkdel=null;render()}},3000);return}S.tkdel=null;closeThread(true);tkRef(id).delete().then(function(){toast('할 일을 지웠어요')},function(e){toast(errMsg(e))});render();return}
  if(a==='cmdel'){if(S.cmdel!==id){S.cmdel=id;renderCmts();setTimeout(function(){if(S.cmdel===id){S.cmdel=null;renderCmts()}},3000);return}S.cmdel=null;var tr=tkRef(S.task);tr.collection('cmts').doc(id).delete().then(function(){return tr.update({cc:FV.increment(-1)})}).catch(function(e){toast(errMsg(e))});return}
  if(a==='mpick')return mpPick(v);
  if(a==='thread')return openThread(id);
  if(a==='tclose')return closeThread();
  if(a==='more'){S.lim+=60;S.keepTop=true;listen();return}
  if(a==='emo'){ev.stopPropagation();S.emo=S.emo===(rid||id)?null:(rid||id);renderMsgs();renderThread();return}
  if(a==='react'){S.emo=null;react(id,rid,b.getAttribute('data-k'));return}
  if(a==='edit'){S.edit=rid||id;rid?renderThread():renderMsgs();setTimeout(function(){var e=document.getElementById('eta');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}},20);return}
  if(a==='edcancel'){S.edit=null;renderMsgs();renderThread();return}
  if(a==='edsave'){var et=document.getElementById('eta');if(et)saveEdit(id,rid,et.value);return}
  if(a==='del'){if(S.delAsk!==(rid||id)){S.delAsk=rid||id;toast('한 번 더 누르면 지워져요');setTimeout(function(){S.delAsk=null},3000);return}S.delAsk=null;delMsg(id,rid);return}
  adminAct(a,b)});
document.addEventListener('scroll',function(ev){if(ev.target&&ev.target.id==='msgs'&&ev.target.scrollTop<40&&S.more&&!S.loadingMore){S.loadingMore=true;S.lim+=60;S.keepTop=true;listen();setTimeout(function(){S.loadingMore=false},800)}},true);
var rzT,wasN=narrow();window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(function(){if(narrow()!==wasN){wasN=narrow();render()}},150)});
})();
</script>
